<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Route 6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🚌</text></svg>'>
<title>Route 6 — Live Arrivals</title>
<style>
:root {
  --bg: #F4F6F4; --card: #FFFFFF; --ink: #17201F; --muted: #5C6B68;
  --line: #E2E7E3; --accent: #0E7A5F; --late: #C23434; --chip-ink: #FFFFFF;
  --go-ink: #FFFFFF;
  --alert-bg: #FFF7E6; --alert-ink: #8A5B00; --alert-line: #F0DCB0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101413; --card: #181E1C; --ink: #E8EFEA; --muted: #93A39D;
    --line: #242C29; --accent: #4FCFA6; --late: #E06060;
    --go-ink: #0E2A21;
    --alert-bg: #2A2413; --alert-ink: #E8C878; --alert-line: #4A3F1E;
  }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
  max-width: 560px; margin: 0 auto; padding: 14px 14px calc(24px + env(safe-area-inset-bottom));
}
header { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px 14px; }
header h1 { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
#age { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
#age.stale { color: var(--late); font-weight: 600; }
#refreshBtn {
  border: 1px solid var(--line); background: var(--card); color: var(--accent);
  border-radius: 8px; font-size: 13px; padding: 4px 10px; cursor: pointer;
  min-width: 68px; text-align: center;
}
.alert {
  background: var(--alert-bg); color: var(--alert-ink); border: 1px solid var(--alert-line);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px;
}
.wx[hidden] { display: none; }
.wx {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 12px; margin-bottom: 12px; font-size: 13.5px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.wx .now { color: var(--ink); font-weight: 650; font-size: 14.5px; }
.wx .advice { margin-left: auto; font-weight: 600; }
@media (max-width: 430px) {
  .wx .advice { margin-left: 0; flex-basis: 100%; }
}
.wx .advice.ok { color: var(--accent); }
.wx .advice.warn { color: var(--alert-ink); }
.wx .advice.bad { color: var(--late); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px 6px; margin-bottom: 12px;
}
.trip-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; flex-wrap: wrap; }
.trip-label { font-weight: 700; font-size: 16px; }
.trip-sub { font-size: 12px; color: var(--muted); }
.trip-sub .soon { color: var(--alert-ink); font-weight: 650; }
.eta-row {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--line);
}
/* missed rows: dim only the numeral (keeps text at full contrast) */
.eta-row.missed .eta-min b { color: var(--muted); }
.eta-row.missed .dir { color: var(--muted); font-weight: 500; }
.pill {
  display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
  padding: 2px 8px; letter-spacing: .3px; text-transform: uppercase; vertical-align: 1px; margin-right: 4px;
}
.pill.go { background: var(--accent); color: var(--go-ink); }
.pill.wait { border: 1px solid var(--line); color: var(--muted); }
.pill.missed { border: 1px solid var(--line); color: var(--muted); }
.eta-mid .dir { font-size: 14px; font-weight: 550; }
.eta-mid .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
.eta-mid .late { color: var(--late); }
.eta-min { text-align: right; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.eta-min b { font-size: 28px; font-weight: 700; }
.eta-min span { font-size: 12px; color: var(--muted); margin-left: 2px; }
.eta-min .now { color: var(--accent); }
.empty { padding: 12px 0 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
#mapCard { padding-bottom: 12px; }
#map { display: block; width: 100%; height: auto; margin-top: 4px; }
.map-stop { fill: var(--muted); opacity: .4; }
.map-mystop { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.map-label { fill: var(--muted); font-size: 11px; font-weight: 600; }
.map-bus text { font-size: 12px; }
.notice { text-align: center; color: var(--muted); font-size: 13px; padding: 12px 6px; }
footer { text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .spin { display: inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
}
</style>
</head>
<body>
<header>
  <h1>🚌 Route 6</h1>
  <span id="age"></span>
  <button id="refreshBtn" title="Refresh now">Refresh</button>
</header>

<div id="wx" class="wx" hidden></div>
<div id="alerts" aria-live="polite"></div>
<div id="board"><p class="notice">Loading…</p></div>

<div class="card" id="mapCard" hidden>
  <div class="trip-head">
    <h2 class="trip-label">🗺️ Live map</h2>
    <span class="trip-sub" id="mapSub"></span>
  </div>
  <svg id="map" role="img" aria-label="Route 6 live vehicle map"></svg>
</div>

<footer>Bloomington Transit · Route 6 Campus Shuttle · refreshes every 20 s</footer>

<script>
'use strict';
const API = 'https://bloomingtontransit.etaspot.net/service.php';
const TOKEN = 'TESTING';
// BT re-numbers ALL internal ids (routes, stops, even extIDs) at every seasonal
// service change, so nothing numeric is hardcoded: the route is resolved by its
// public number and the stops by their full names, per dataset version.
const ROUTE_ABBR = '6'; // "6 Campus Shuttle"
const TRIPS = [
  { icon: '🏫', label: 'To campus',
    boardStop: '10th St & SR 45/46 @ UITS', destStop: '10th St & Forrest Ave @ Geology and Informatics',
    boardName: '10th & SR 45/46', destName: '10th & Forrest Ave', walkMin: 10, showFirst: true },
  { icon: '🏠', label: 'Back home',
    boardStop: 'Woodlawn Ave and 10th St at Woodlawn Field', destStop: '10th St @ Scholars Quad Apts',
    boardName: 'Woodlawn & 10th', destName: 'Scholars Quad', walkMin: 5, showLast: true },
];
let STOP_IDS = [];
let BOARD_IDS = new Set();
function resolveTrips() {
  const byName = new Map(state.stops.map(s => [String(s.name).trim().toLowerCase(), Number(s.id)]));
  for (const t of TRIPS) {
    t.board = byName.get(t.boardStop.toLowerCase());
    t.dest = byName.get(t.destStop.toLowerCase());
  }
  if (!TRIPS.every(t => t.board && t.dest)) return false;
  STOP_IDS = [...new Set(TRIPS.flatMap(t => [t.board, t.dest]))];
  BOARD_IDS = new Set(TRIPS.map(t => t.board));
  return true;
}
const GO_WINDOW = 2; // "leave now" when bus arrives within walkMin .. walkMin+2

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const state = { routeId: null, stops: [], stopById: new Map(), patterns: [], vehicles: [], etas: {}, alerts: [], sched: null, lastOk: 0, offline: false };
let feedVer = null;       // ETA SPOT dataset version, used to invalidate caches on service changes
let refreshing = false;
let schedBusy = false, schedRetryAt = 0, schedDelay = 10 * 60e3;
let staticNextTry = 0;
let lastAlertsHTML = '';

async function call(service, params = '') {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(`${API}?service=${service}&token=${TOKEN}${params}`, { signal: ctl.signal });
    const text = await r.text();
    let j;
    try { j = JSON.parse(text); } catch { throw new Error(`${service}: unexpected API response`); }
    if (!(service in j)) throw new Error(`${service}: missing data in response`);
    return j[service];
  } finally { clearTimeout(timer); }
}

const readCache = key => {
  try {
    const c = JSON.parse(localStorage.getItem(key) || 'null');
    return c && typeof c.ts === 'number' ? c : null;
  } catch { return null; }
};
const cacheFresh = (c, ttl) => !!c && (feedVer && c.ver ? c.ver === feedVer : Date.now() - c.ts < ttl);

async function getVersion() {
  try {
    const v = await call('get_version_id');
    return v && v.versionID != null ? String(v.versionID) : null;
  } catch { return null; }
}

// Stop coordinates + route-6 patterns for the "stops away" estimate.
// Cache is keyed to the feed version when known, else a 24 h TTL. Failure is
// never fatal: live ETAs work without static data (stops-away just disappears),
// and refresh() retries this in the background once the network is back.
async function loadStatic() {
  let c = readCache('bt6_static2');
  const valid = c && c.routeId != null && Array.isArray(c.stops) && Array.isArray(c.patterns);
  if (!valid || !cacheFresh(c, 24 * 3600e3)) {
    try {
      const [routes, stops, patterns] = await Promise.all([call('get_routes'), call('get_stops'), call('get_patterns')]);
      const route = routes.find(r => String(r.abbr).trim() === ROUTE_ABBR);
      if (!route) throw new Error('route not in dataset');
      const rid = Number(route.id);
      c = {
        ts: Date.now(), ver: feedVer, routeId: rid,
        stops: stops.filter(s => Number(s.rid) === rid),
        patterns: patterns.filter(p => (p.routes || []).some(r => Number(r) === rid))
          .map(p => ({ ...p, stopIDs: (p.stopIDs || []).map(Number) })),
      };
      try { localStorage.setItem('bt6_static2', JSON.stringify(c)); } catch {}
    } catch {
      if (!valid) c = { routeId: null, stops: [], patterns: [] }; // degrade: retried from refresh()
    }
  }
  state.routeId = c.routeId != null ? Number(c.routeId) : null;
  state.stops = c.stops || [];
  state.patterns = (c.patterns || []).filter(p => Array.isArray(p.stopIDs));
  state.stopById = new Map(state.stops.map(s => [Number(s.id), s]));
  resolveTrips();
  mapBuilt = false; // route geometry may have changed with the dataset
}

// Route-6 timetable rows for our stops (first/last bus). ~4 MB, so: fetched only
// when needed, cached keyed to feed version (7-day TTL fallback), an empty parse
// is never cached, and failures back off exponentially (10 min → … → 6 h).
const timeToMin = t => {
  const m = /^(\d+):(\d+)(AM|PM)$/.exec(t);
  if (!m) return null;
  let h = +m[1] % 12; if (m[3] === 'PM') h += 12;
  return h * 60 + +m[2];
};
async function loadSchedules() {
  if (!STOP_IDS.length || state.sched || schedBusy || Date.now() < schedRetryAt) return;
  const c = readCache('bt6_sched');
  if (c && c.byStop && Object.keys(c.byStop).length && cacheFresh(c, 7 * 24 * 3600e3)) {
    state.sched = c.byStop; safeRender(); return;
  }
  schedBusy = true;
  const backoff = () => { schedRetryAt = Date.now() + schedDelay; schedDelay = Math.min(schedDelay * 2, 6 * 3600e3); };
  try {
    const rows = await call('get_schedules');
    const byStop = {};
    for (const r of rows) {
      if (!STOP_IDS.includes(Number(r.stationID))) continue;
      if (String(r.scheduleName || '').split(' - ')[0].trim() !== ROUTE_ABBR) continue;
      const min = timeToMin(r.stopTime);
      if (min == null) continue;
      (byStop[r.stationID] = byStop[r.stationID] || []).push({ d: String(r.weekdays || ''), t: r.stopTime, m: min });
    }
    if (Object.keys(byStop).length) {
      state.sched = byStop;
      schedDelay = 10 * 60e3;
      try { localStorage.setItem('bt6_sched', JSON.stringify({ ts: Date.now(), ver: feedVer, byStop })); } catch {}
    } else backoff(); // odd/empty parse: cache nothing, retry with backoff
  } catch { backoff(); }
  schedBusy = false;
  safeRender();
}
function todayServiceSpan(stopId) {
  if (!state.sched) return null;
  const day = new Date().getDay(); // 0=Sun
  const c = day === 0 ? '7' : String(day);
  const rows = (state.sched[stopId] || []).filter(r => r.d.includes(c)).sort((a, b) => a.m - b.m);
  if (!rows.length) return { none: true };
  return { first: rows[0].t, firstM: rows[0].m, last: rows[rows.length - 1].t, lastM: rows[rows.length - 1].m };
}

// Partial results are kept: each response updates its own slice of state; the
// staleness clock and offline banner key off the BOARDING stops (the ones that
// matter); try/finally guarantees the in-flight lock always releases.
async function refresh() {
  if (!STOP_IDS.length) {
    // stops not resolved yet (cold or offline boot) — nothing to poll; retry static
    if (Date.now() > staticNextTry) {
      staticNextTry = Date.now() + 60e3;
      getVersion().then(v => { if (v) feedVer = v; return loadStatic(); }).then(safeRender).catch(() => {});
    }
    return;
  }
  if (refreshing) return;
  refreshing = true;
  $('#refreshBtn').innerHTML = '<span class="spin">⟳</span>';
  try {
    const results = await Promise.allSettled(
      [call('get_vehicles'), call('get_service_announcements')]
        .concat(STOP_IDS.map(id => call('get_stop_etas', `&stopID=${id}`)))
    );
    const [veh, al, ...etaResults] = results;
    if (veh.status === 'fulfilled' && Array.isArray(veh.value)) state.vehicles = veh.value;
    if (al.status === 'fulfilled' && Array.isArray(al.value)) state.alerts = al.value;
    let boardOk = false;
    STOP_IDS.forEach((id, i) => {
      const r = etaResults[i];
      if (r.status !== 'fulfilled' || !Array.isArray(r.value)) return;
      const en = r.value[0] && r.value[0].enRoute;
      state.etas[id] = (Array.isArray(en) ? en : []).filter(e => Number(e.routeID) === state.routeId);
      if (BOARD_IDS.has(id)) boardOk = true;
    });
    state.offline = !boardOk;
    const rendered = safeRender();
    if (rendered && boardOk) state.lastOk = Date.now();
    if (state.offline) $('#board').insertAdjacentHTML('afterbegin', '<p class="notice">⚠️ Can’t reach Bloomington Transit — retrying…</p>');
    if (TRIPS.some(t => !(state.etas[t.board] || []).length)) loadSchedules();
    // static data / feed version recovery when boot happened offline
    if (boardOk && !state.patterns.length && Date.now() > staticNextTry) {
      staticNextTry = Date.now() + 5 * 60e3;
      getVersion().then(v => { if (v) feedVer = v; return loadStatic(); }).then(safeRender).catch(() => {});
    }
  } finally {
    refreshing = false;
    $('#refreshBtn').textContent = 'Refresh';
  }
}

const dist2 = (a, b, c, d) => (a - c) ** 2 + (b - d) ** 2;

// "Stops away" along the pattern THE VEHICLE is running (patternID), using its
// own nextStopID when present. Omitted when the bus is on the opposite
// direction of its loop or already past the stop — no number beats a wrong one.
function stopsAway(eta, stopId) {
  const eid = String(eta.equipmentID || '');
  if (!eid || eid === '-') return null;
  const veh = state.vehicles.find(v => String(v.equipmentID) === eid);
  if (!veh) return null;
  const sid = Number(stopId);
  const pat = state.patterns.find(p => Number(p.id) === Number(veh.patternID));
  if (!pat || !pat.stopIDs.includes(sid)) return null;
  const tIdx = pat.stopIDs.indexOf(sid);
  let vIdx = veh.nextStopID ? pat.stopIDs.indexOf(Number(veh.nextStopID)) : -1;
  if (vIdx < 0) {
    let best = Infinity;
    pat.stopIDs.forEach((s2, i) => {
      const s = state.stopById.get(s2);
      if (!s) return;
      const d = dist2(s.lat, s.lng, veh.lat, veh.lng);
      if (d < best) { best = d; vIdx = i; }
    });
  }
  if (vIdx < 0) return null;
  const n = tIdx - vIdx;
  return n >= 1 ? n : null;
}

// —— Live map: route geometry from the patterns' encoded polylines, ——
// —— vehicle dots re-drawn from the same get_vehicles poll. No tiles. ——
let mapBuilt = false, mapProj = null;
function decLine(str) { // standard Google encoded-polyline decoder
  let i = 0, lat = 0, lng = 0; const pts = [];
  while (i < str.length) {
    for (const which of [0, 1]) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const d = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (which === 0) lat += d; else lng += d;
    }
    pts.push([lat / 1e5, lng / 1e5]);
  }
  return pts;
}
const safeColor = c => /^#[0-9a-fA-F]{3,8}$/.test(String(c)) ? c : 'var(--accent)';
function buildMap() {
  const pats = state.patterns.filter(p => typeof p.encLine === 'string' && p.encLine.length > 1);
  if (!pats.length) return;
  const lines = pats.map(p => ({ p, pts: decLine(p.encLine) }));
  const all = lines.flatMap(l => l.pts);
  if (all.length < 2) return;
  let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  for (const [la, ln] of all) {
    if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
    if (ln < minLng) minLng = ln; if (ln > maxLng) maxLng = ln;
  }
  const cos = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const W = 400, PAD = 16;
  const k = (maxLng - minLng) * cos > 0 ? W / ((maxLng - minLng) * cos) : 1;
  const H = Math.max(120, (maxLat - minLat) * k);
  mapProj = (la, ln) => [PAD + (ln - minLng) * cos * k, PAD + (maxLat - la) * k];
  const svg = $('#map');
  svg.setAttribute('viewBox', `0 0 ${(W + 2 * PAD).toFixed(0)} ${(H + 2 * PAD).toFixed(0)}`);
  let html = '';
  lines.forEach(({ p, pts }, i) => {
    const d = pts.map(([la, ln], j) => (j ? 'L' : 'M') + mapProj(la, ln).map(n => n.toFixed(1)).join(' ')).join('');
    html += `<path d="${d}" fill="none" stroke="${safeColor(p.color)}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="${i === 0 ? 0.8 : 0.35}"/>`;
  });
  for (const s of state.stopById.values()) {
    const [x, y] = mapProj(s.lat, s.lng);
    html += `<circle class="map-stop" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5"/>`;
  }
  for (const id of STOP_IDS) {
    const s = state.stopById.get(Number(id));
    if (!s) continue;
    const [x, y] = mapProj(s.lat, s.lng);
    html += `<circle class="map-mystop" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"/>`;
  }
  const home = state.stopById.get(Number(TRIPS[0].board)), campus = state.stopById.get(Number(TRIPS[0].dest));
  if (home) { const [x, y] = mapProj(home.lat, home.lng); html += `<text class="map-label" x="${(x + 4).toFixed(1)}" y="${(y - 9).toFixed(1)}">Home</text>`; }
  if (campus) { const [x, y] = mapProj(campus.lat, campus.lng); html += `<text class="map-label" x="${(x - 4).toFixed(1)}" y="${(y - 9).toFixed(1)}" text-anchor="end">Luddy</text>`; }
  html += '<g id="busLayer"></g>';
  svg.innerHTML = html;
  $('#mapCard').hidden = false;
  mapBuilt = true;
}
function drawBuses() {
  if (!mapBuilt || !mapProj) return;
  const box = $('#map').viewBox.baseVal;
  const buses = state.vehicles.filter(v => Number(v.routeID) === state.routeId);
  $('#busLayer').innerHTML = buses.map(v => {
    const [x, y] = mapProj(Number(v.lat), Number(v.lng));
    if (x < -20 || y < -20 || x > box.width + 20 || y > box.height + 20) return ''; // off-route (depot etc.)
    const col = safeColor((state.patterns.find(p => Number(p.id) === Number(v.patternID)) || {}).color);
    return `<g class="map-bus" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">`
      + `<circle r="8.5" fill="${col}" stroke="var(--card)" stroke-width="2"/>`
      + `<text text-anchor="middle" dy="4">🚌</text></g>`;
  }).join('');
  $('#mapSub').textContent = buses.length
    ? `${buses.length} bus${buses.length > 1 ? 'es' : ''} live · dots = stops, rings = your stops`
    : 'no buses on the road right now';
}

// Announcements arrive as groups: {type, announcements: [{text, start, end,
// cause, effect, affectedRoutes?}]}. Only route-relevant (or system-wide) ones
// are shown; extraction stays defensive against future shape changes and all
// API strings are HTML-escaped at the sink.
function alertTexts(raw) {
  const out = [];
  for (const g of Array.isArray(raw) ? raw : []) {
    if (typeof g === 'string') { if (g.trim()) out.push(g.trim()); continue; }
    const anns = Array.isArray(g && g.announcements) ? g.announcements : [g];
    for (const a of anns) {
      if (typeof a === 'string') { if (a.trim()) out.push(a.trim()); continue; }
      if (!a || typeof a !== 'object') continue;
      if (Array.isArray(a.affectedRoutes) && a.affectedRoutes.length
          && !a.affectedRoutes.some(r => Number(r && r.routeID) === state.routeId)) continue;
      const t = [a.text, a.title, a.message, a.announcement, a.description]
        .find(v => typeof v === 'string' && v.trim());
      if (t) out.push(t.trim());
    }
  }
  return out;
}

function render() {
  // only touch the aria-live region when content actually changed
  const alertsHTML = alertTexts(state.alerts)
    .map(t => `<div class="alert">📢 ${esc(t)}</div>`).join('');
  if (alertsHTML !== lastAlertsHTML) { $('#alerts').innerHTML = alertsHTML; lastAlertsHTML = alertsHTML; }

  if (!STOP_IDS.length) {
    $('#board').innerHTML = '<p class="notice">Loading route data…</p>';
    return;
  }

  $('#board').innerHTML = TRIPS.map(t => {
    const etas = (state.etas[t.board] || []).slice()
      .sort((a, b) => Number(a.minutes) - Number(b.minutes)).slice(0, 3);
    const rows = etas.map(e => {
      const eid = String(e.equipmentID || '');
      const mins = Number(e.minutes) || 0; // coerce: sole numeric API field reaching HTML
      const away = stopsAway(e, t.board);
      // late = prediction ≥2 min behind schedule (vendor statuscolor is unreliable)
      const schedM = timeToMin(e.schedule), predM = timeToMin(e.time);
      let diff = schedM != null && predM != null ? predM - schedM : 0;
      if (diff < -720) diff += 1440; else if (diff > 720) diff -= 1440;
      const lateFlag = diff >= 2;
      const destEta = eid && eid !== '-'
        ? (state.etas[t.dest] || []).find(d => String(d.equipmentID) === eid && Number(d.minutes) > mins)
        : null;
      const slack = mins - t.walkMin; // minutes to spare after walking
      const status = slack < 0 ? 'missed' : slack <= GO_WINDOW ? 'go' : 'wait';
      // the leave-now hint only makes sense on a near horizon
      const pill = mins > 90 ? '' : status === 'go' ? '<span class="pill go">Leave now</span>'
        : status === 'wait' ? `<span class="pill wait">Leave in ~${slack} min</span>`
        : '<span class="pill missed">Too late</span>';
      const meta = [
        away != null ? `~${away} stop${away === 1 ? '' : 's'} away` : '',
        destEta ? `arrives ~${esc(destEta.time)}` : '',
        lateFlag ? `<span class="late">late (sched ${esc(e.schedule)})</span>` : '',
        eid && eid !== '-' ? `Bus ${esc(eid)}` : '',
      ].filter(Boolean).join(' · ');
      return `<div class="eta-row ${status === 'missed' ? 'missed' : ''}">
        <div class="eta-mid">
          <div class="dir">${pill} Board ${esc(e.time)}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ''}
        </div>
        <div class="eta-min">${mins <= 0 ? '<b class="now">Due</b>' : `<b>${mins}</b><span>min</span>`}</div>
      </div>`;
    }).join('');
    let empty = '';
    if (!rows) {
      const span = todayServiceSpan(t.board);
      empty = `<div class="empty">${
        !span ? 'No buses right now.'
        : span.none ? 'No Route 6 service today.'
        : `No buses right now · today: first ${esc(span.first)} · last ${esc(span.last)}`
      }</div>`;
    }
    // outbound card carries today's first bus, homebound card the last one;
    // highlighted while it is the number that decides your next move
    let lastTag = '';
    const svc = (t.showFirst || t.showLast) ? todayServiceSpan(t.board) : null;
    if (svc && !svc.none) {
      const now = new Date(); const nowM = now.getHours() * 60 + now.getMinutes();
      if (t.showFirst) {
        const notYet = nowM < svc.firstM; // service hasn't started for the day
        lastTag = ` · <span class="${notYet ? 'soon' : ''}">first ${esc(svc.first)}</span>`;
      } else {
        const soon = svc.lastM - nowM > 0 && svc.lastM - nowM <= 60;
        lastTag = ` · <span class="${soon ? 'soon' : ''}">last ${esc(svc.last)}</span>`;
      }
    }
    return `<div class="card">
      <div class="trip-head">
        <h2 class="trip-label">${t.icon} ${t.label}</h2>
        <span class="trip-sub">${t.boardName} → ${t.destName} · ${t.walkMin} min walk${lastTag}</span>
      </div>
      ${rows || empty}
    </div>`;
  }).join('');

  if (!mapBuilt && state.patterns.length) buildMap();
  drawBuses();
}

function safeRender() {
  try { render(); return true; }
  catch (e) { console.error('render failed', e); return false; }
}

function renderAge() {
  const el = $('#age');
  if (!state.lastOk) { el.textContent = ''; return; }
  const s = Math.round((Date.now() - state.lastOk) / 1000);
  const stale = s > 60;
  el.classList.toggle('stale', stale);
  el.textContent = `${stale ? '⚠️ stale · ' : ''}updated ${s} s ago`;
}

// —— Weather (Open-Meteo, free/no key) for the departure window ——
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=39.169&longitude=-86.514'
  + '&current=temperature_2m,weather_code&hourly=precipitation_probability,precipitation,weather_code'
  + '&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2';
let wxFetched = 0;
const WMO = c =>
  c === 0 ? ['☀️', 'Clear'] : c <= 2 ? ['🌤', 'Partly cloudy'] : c === 3 ? ['☁️', 'Cloudy']
  : c <= 48 ? ['🌫', 'Fog'] : c <= 57 ? ['🌦', 'Drizzle'] : c <= 67 ? ['🌧', 'Rain']
  : c <= 77 ? ['🌨', 'Snow'] : c <= 82 ? ['🌦', 'Showers'] : c <= 86 ? ['🌨', 'Snow showers']
  : ['⛈', 'Thunderstorm'];
const isSnow = c => (c >= 71 && c <= 77) || c === 85 || c === 86;
const fmt12 = hm => {
  const [h, m] = hm.split(':').map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, '0')}${h >= 12 ? 'PM' : 'AM'}`;
};

async function loadWeather() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(WX_URL, { signal: ctl.signal });
    if (!r.ok) throw new Error('wx http ' + r.status);
    const w = await r.json();
    const [icon, label] = WMO(w.current.weather_code);
    const lo = Math.round(w.daily.temperature_2m_min[0]), hi = Math.round(w.daily.temperature_2m_max[0]);
    // departure window: this hour + next 2 (indexed off the API's own local clock)
    const idx = Math.max(0, w.hourly.time.indexOf(w.current.time.slice(0, 13) + ':00'));
    const win = [idx, idx + 1, idx + 2].filter(i => i < w.hourly.time.length);
    let advice = '<span class="advice ok">✅ Good to go</span>';
    const wetAt = win.find(i =>
      w.hourly.precipitation_probability[i] >= 40 || w.hourly.precipitation[i] >= 0.3 || w.hourly.weather_code[i] >= 51);
    if (wetAt != null) {
      const at = fmt12(w.hourly.time[wetAt].slice(11, 16));
      const code = w.hourly.weather_code[wetAt];
      const heavy = code >= 95 || code === 65 || code === 67 || code === 82 || w.hourly.precipitation[wetAt] >= 4;
      advice = isSnow(code)
        ? `<span class="advice warn">❄️ Snow around ${at} — allow extra time</span>`
        : heavy
        ? `<span class="advice bad">⛈ Heavy rain around ${at} — consider waiting</span>`
        : `<span class="advice warn">☔ Rain likely around ${at} — bring an umbrella</span>`;
    }
    $('#wx').innerHTML = `<span class="now">${icon} ${Math.round(w.current.temperature_2m)}°C</span>`
      + `<span>${label}</span><span>${lo}–${hi}°C today</span>${advice}`;
    $('#wx').hidden = false;
    wxFetched = Date.now(); // only after a fully successful render
  } catch { /* weather is best-effort; hide on failure */ $('#wx').hidden = true; }
  finally { clearTimeout(timer); }
}

$('#refreshBtn').addEventListener('click', refresh);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  refresh();
  if (Date.now() - wxFetched > 15 * 60e3) loadWeather();
});

(async () => {
  loadWeather();
  // resolve ids first (instant when the version-keyed cache is warm), then poll
  try { const v = await Promise.race([getVersion(), new Promise(res => setTimeout(() => res(null), 2500))]); if (v) feedVer = v; } catch {}
  await loadStatic();
  safeRender();
  refresh();
  loadSchedules();
  setInterval(refresh, 20000);
  setInterval(loadWeather, 15 * 60e3);
  setInterval(renderAge, 1000);
  // seasonal service change: re-check the feed version every 6 h while resident
  setInterval(() => {
    getVersion().then(v => {
      if (!v) return;
      if (feedVer && v !== feedVer) {
        feedVer = v; state.sched = null; schedRetryAt = 0;
        loadStatic().then(() => { loadSchedules(); safeRender(); });
      } else if (!feedVer) feedVer = v;
    }).catch(() => {});
  }, 6 * 3600e3);
})();
</script>
