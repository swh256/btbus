<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bloomington Bus — Live Arrivals</title>
<style>
:root {
  --bg: #F4F6F4; --card: #FFFFFF; --ink: #17201F; --muted: #5C6B68;
  --line: #E2E7E3; --accent: #0E7A5F; --late: #C23434; --chip-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101413; --card: #181E1C; --ink: #E8EFEA; --muted: #93A39D;
    --line: #242C29; --accent: #4FCFA6; --late: #E06060;
  }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
  max-width: 560px; margin: 0 auto; padding: 14px 14px calc(24px + env(safe-area-inset-bottom));
}
header { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px 14px; }
header h1 { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
#age { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
#refreshBtn {
  border: 1px solid var(--line); background: var(--card); color: var(--accent);
  border-radius: 8px; font-size: 13px; padding: 4px 10px; cursor: pointer;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px 6px; margin-bottom: 12px;
}
.stop-head { display: flex; align-items: flex-start; gap: 8px; padding-bottom: 4px; }
.stop-name { font-weight: 650; font-size: 15px; }
.stop-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.del {
  margin-left: auto; border: 0; background: none; color: var(--muted);
  font-size: 16px; cursor: pointer; padding: 0 2px; line-height: 1;
}
.eta-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--line);
}
.route-chip {
  min-width: 34px; height: 34px; border-radius: 9px; color: var(--chip-ink);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; padding: 0 6px;
}
.eta-mid .dir { font-size: 14px; font-weight: 550; }
.eta-mid .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
.eta-mid .late { color: var(--late); }
.eta-min { text-align: right; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.eta-min b { font-size: 26px; font-weight: 700; }
.eta-min span { font-size: 12px; color: var(--muted); margin-left: 2px; }
.eta-min .now { color: var(--accent); }
.empty { padding: 12px 0 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.notice { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 6px; }
#search {
  width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 12px; padding: 11px 13px; font-size: 15px; outline: none;
}
#search:focus { border-color: var(--accent); }
#results { margin-top: 8px; }
.result {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 6px; color: var(--ink); font-size: 14px; cursor: pointer;
}
.result small { color: var(--muted); margin-left: auto; white-space: nowrap; }
footer { text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 8px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: no-preference) {
  .spin { display: inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
}
</style>
</head>
<body>
<header>
  <h1>🚌 Bloomington Bus</h1>
  <span id="age"></span>
  <button id="refreshBtn" title="Refresh now">Refresh</button>
</header>

<div id="board"></div>

<div class="card" id="addCard">
  <input id="search" type="search" placeholder="Search stops to pin (e.g. 3rd, Walmart, Kirkwood)" autocomplete="off">
  <div id="results"></div>
</div>

<footer>Data from Bloomington Transit (ETA SPOT public API). Auto-refreshes every 20 s.</footer>

<script>
'use strict';
const API = 'https://bloomingtontransit.etaspot.net/service.php';
const TOKEN = 'TESTING';
const $ = s => document.querySelector(s);
const state = { stops: [], stopById: new Map(), routes: new Map(), patterns: [], routeColor: {}, vehicles: [], etas: {}, lastOk: 0 };

const favs = {
  get: () => { try { return JSON.parse(localStorage.bt_favs || '[]'); } catch { return []; } },
  set: v => localStorage.bt_favs = JSON.stringify(v),
};

async function call(service, params = '') {
  const r = await fetch(`${API}?service=${service}&token=${TOKEN}${params}`);
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); } catch { throw new Error(`${service}: unexpected API response`); }
  if (!(service in j)) throw new Error(`${service}: missing data in response`);
  return j[service];
}

// Static data (stops/routes/patterns), cached in localStorage for 24 h
async function loadStatic() {
  let cached = null;
  try { cached = JSON.parse(localStorage.bt_static || 'null'); } catch {}
  if (cached && Date.now() - cached.ts < 24 * 3600e3) return applyStatic(cached);
  const [stops, routes, patterns] = await Promise.all([call('get_stops'), call('get_routes'), call('get_patterns')]);
  const data = { ts: Date.now(), stops, routes, patterns };
  try { localStorage.bt_static = JSON.stringify(data); } catch {}
  applyStatic(data);
}
function applyStatic(d) {
  state.patterns = d.patterns;
  for (const p of d.patterns) for (const rid of p.routes) if (!(rid in state.routeColor)) state.routeColor[rid] = p.color;
  for (const r of d.routes) state.routes.set(r.id, r);
  const seen = new Map();
  for (const s of d.stops) {
    if (!seen.has(s.id)) { seen.set(s.id, { id: s.id, name: s.name, lat: s.lat, lng: s.lng, routes: new Set() }); }
    seen.get(s.id).routes.add(s.rid);
  }
  state.stops = [...seen.values()];
  state.stopById = new Map(state.stops.map(s => [s.id, s]));
}

// Live data
async function refresh() {
  const ids = favs.get();
  $('#refreshBtn').innerHTML = '<span class="spin">⟳</span>';
  try {
    const jobs = [call('get_vehicles')].concat(ids.map(id => call('get_stop_etas', `&stopID=${id}`)));
    const [vehicles, ...etaResults] = await Promise.all(jobs);
    state.vehicles = vehicles;
    ids.forEach((id, i) => { state.etas[id] = (etaResults[i][0] && etaResults[i][0].enRoute) || []; });
    state.lastOk = Date.now();
  } catch (e) {
    $('#board').insertAdjacentHTML('afterbegin', `<p class="notice">⚠️ ${e.message} (will retry automatically)</p>`);
  }
  $('#refreshBtn').textContent = 'Refresh';
  render();
}

const dist2 = (a, b, c, d) => (a - c) ** 2 + (b - d) ** 2;
const DIR_ABBR = { Inbound: 'IB', Outbound: 'OB', Eastbound: 'EB', Westbound: 'WB', 'Towards Campus': 'TC', 'Leaving Campus': 'LC' };

// Estimate "stops away": pick the pattern for this route/direction,
// locate the vehicle's nearest stop index, diff against the target stop index
function stopsAway(eta, stopId) {
  const veh = state.vehicles.find(v => String(v.equipmentID) === String(eta.equipmentID));
  if (!veh) return null;
  const abbr = DIR_ABBR[eta.direction];
  let pats = state.patterns.filter(p => p.routes.includes(eta.routeID) && p.stopIDs.includes(stopId));
  if (abbr && pats.some(p => p.name.endsWith(abbr))) pats = pats.filter(p => p.name.endsWith(abbr));
  const pat = pats[0];
  if (!pat) return null;
  let vIdx = 0, best = Infinity;
  pat.stopIDs.forEach((sid, i) => {
    const s = state.stopById.get(sid);
    if (!s) return;
    const d = dist2(s.lat, s.lng, veh.lat, veh.lng);
    if (d < best) { best = d; vIdx = i; }
  });
  const tIdx = pat.stopIDs.indexOf(stopId);
  let n = tIdx - vIdx;
  if (n < 0) n += pat.stopIDs.length;
  return n;
}

// Rendering
function render() {
  const ids = favs.get();
  const board = $('#board');
  if (!ids.length) {
    board.innerHTML = '<p class="notice">No pinned stops yet — search below and tap one to pin it.</p>';
    return;
  }
  board.innerHTML = ids.map(id => {
    const stop = state.stopById.get(id);
    if (!stop) return '';
    const routeChips = [...stop.routes].map(r => state.routes.get(r)?.abbr ?? r).join(' / ');
    const etas = (state.etas[id] || []).slice().sort((a, b) => a.minutes - b.minutes).slice(0, 4);
    const rows = etas.map(e => {
      const route = state.routes.get(e.routeID);
      const color = state.routeColor[e.routeID] || 'var(--accent)';
      const away = stopsAway(e, id);
      const late = e.statuscolor && e.statuscolor.toUpperCase() !== '#000000' && e.schedule !== e.time;
      return `<div class="eta-row">
        <div class="route-chip" style="background:${color}">${route?.abbr ?? e.routeID}</div>
        <div class="eta-mid">
          <div class="dir">${e.direction || ''}${away != null ? ` · ~${away} stops away` : ''}</div>
          <div class="meta">ETA ${e.time}${late ? ` · <span class="late">late (sched ${e.schedule})</span>` : ''} · Bus ${e.equipmentID}</div>
        </div>
        <div class="eta-min">${e.minutes <= 0 ? '<b class="now">Due</b>' : `<b>${e.minutes}</b><span>min</span>`}</div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="stop-head">
        <div><div class="stop-name">${stop.name}</div><div class="stop-sub">Routes ${routeChips} · Stop #${id}</div></div>
        <button class="del" data-del="${id}" title="Remove">✕</button>
      </div>
      ${rows || '<div class="empty">No upcoming arrivals (service may have ended for the day)</div>'}
    </div>`;
  }).join('');
}

function renderAge() {
  $('#age').textContent = state.lastOk ? `updated ${Math.round((Date.now() - state.lastOk) / 1000)} s ago` : '';
}

// Search / pinning
$('#search').addEventListener('input', () => {
  const q = $('#search').value.trim().toLowerCase();
  const box = $('#results');
  if (q.length < 2) { box.innerHTML = ''; return; }
  const cur = new Set(favs.get());
  const hits = state.stops.filter(s => s.name.toLowerCase().includes(q) && !cur.has(s.id)).slice(0, 8);
  box.innerHTML = hits.map(s =>
    `<button class="result" data-add="${s.id}">${s.name}<small>Routes ${[...s.routes].map(r => state.routes.get(r)?.abbr ?? r).join('/')}</small></button>`
  ).join('') || '<p class="notice">No matching stops</p>';
});
document.addEventListener('click', e => {
  const add = e.target.closest('[data-add]'), del = e.target.closest('[data-del]');
  if (add) {
    favs.set([...favs.get(), Number(add.dataset.add)]);
    $('#search').value = ''; $('#results').innerHTML = '';
    refresh();
  }
  if (del) {
    favs.set(favs.get().filter(x => x !== Number(del.dataset.del)));
    render();
  }
});
$('#refreshBtn').addEventListener('click', refresh);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

// Boot
(async () => {
  try {
    await loadStatic();
  } catch (e) {
    $('#board').innerHTML = `<p class="notice">⚠️ Could not load route data: ${e.message}</p>`;
    return;
  }
  await refresh();
  setInterval(refresh, 20000);
  setInterval(renderAge, 1000);
})();
</script>
</body>
</html>
