<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Route 6 — Live Arrivals</title>
<style>
:root {
  --bg: #F4F6F4; --card: #FFFFFF; --ink: #17201F; --muted: #5C6B68;
  --line: #E2E7E3; --accent: #0E7A5F; --late: #C23434; --chip-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101413; --card: #181E1C; --ink: #E8EFEA; --muted: #93A39D;
    --line: #242C29; --accent: #4FCFA6; --late: #E06060;
  }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
  max-width: 560px; margin: 0 auto; padding: 14px 14px calc(24px + env(safe-area-inset-bottom));
}
header { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px 14px; }
header h1 { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
#age { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
#refreshBtn {
  border: 1px solid var(--line); background: var(--card); color: var(--accent);
  border-radius: 8px; font-size: 13px; padding: 4px 10px; cursor: pointer;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px 6px; margin-bottom: 12px;
}
.trip-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; }
.trip-label { font-weight: 700; font-size: 16px; }
.trip-sub { font-size: 12px; color: var(--muted); }
.eta-row {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--line);
}
.eta-mid .dir { font-size: 14px; font-weight: 550; }
.eta-mid .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
.eta-mid .late { color: var(--late); }
.eta-min { text-align: right; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.eta-min b { font-size: 28px; font-weight: 700; }
.eta-min span { font-size: 12px; color: var(--muted); margin-left: 2px; }
.eta-min .now { color: var(--accent); }
.empty { padding: 12px 0 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.notice { text-align: center; color: var(--muted); font-size: 13px; padding: 12px 6px; }
footer { text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .spin { display: inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
}
</style>
</head>
<body>
<header>
  <h1>🚌 Route 6</h1>
  <span id="age"></span>
  <button id="refreshBtn" title="Refresh now">Refresh</button>
</header>

<div id="board"><p class="notice">Loading…</p></div>

<footer>Bloomington Transit Route 6 (Campus Shuttle) · auto-refreshes every 20 s</footer>

<script>
'use strict';
const API = 'https://bloomingtontransit.etaspot.net/service.php';
const TOKEN = 'TESTING';
const ROUTE = 6; // internal route id of "6 Campus Shuttle"
const TRIPS = [
  { icon: '🏫', label: 'To campus', board: 320, dest: 326, boardName: '10th & SR 45/46', destName: '10th & Forrest Ave' },
  { icon: '🏠', label: 'Home',      board: 674, dest: 780, boardName: 'Woodlawn & 10th', destName: 'Scholars Quad' },
];
const STOP_IDS = [...new Set(TRIPS.flatMap(t => [t.board, t.dest]))];

const $ = s => document.querySelector(s);
const state = { stopById: new Map(), patterns: [], vehicles: [], etas: {}, lastOk: 0 };

async function call(service, params = '') {
  const r = await fetch(`${API}?service=${service}&token=${TOKEN}${params}`);
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); } catch { throw new Error(`${service}: unexpected API response`); }
  if (!(service in j)) throw new Error(`${service}: missing data in response`);
  return j[service];
}

// Stop coordinates + route-6 patterns for the "stops away" estimate; cached 24 h
async function loadStatic() {
  let cached = null;
  try { cached = JSON.parse(localStorage.bt6_static || 'null'); } catch {}
  if (!cached || Date.now() - cached.ts > 24 * 3600e3) {
    const [stops, patterns] = await Promise.all([call('get_stops'), call('get_patterns')]);
    cached = { ts: Date.now(), stops: stops.filter(s => s.rid === ROUTE), patterns: patterns.filter(p => p.routes.includes(ROUTE)) };
    try { localStorage.bt6_static = JSON.stringify(cached); } catch {}
  }
  state.patterns = cached.patterns;
  state.stopById = new Map(cached.stops.map(s => [s.id, s]));
}

async function refresh() {
  $('#refreshBtn').innerHTML = '<span class="spin">⟳</span>';
  try {
    const [vehicles, ...etaResults] = await Promise.all(
      [call('get_vehicles')].concat(STOP_IDS.map(id => call('get_stop_etas', `&stopID=${id}`)))
    );
    state.vehicles = vehicles;
    STOP_IDS.forEach((id, i) => {
      state.etas[id] = ((etaResults[i][0] && etaResults[i][0].enRoute) || []).filter(e => e.routeID === ROUTE);
    });
    state.lastOk = Date.now();
  } catch (e) {
    $('#board').insertAdjacentHTML('afterbegin', `<p class="notice">⚠️ ${e.message} (will retry automatically)</p>`);
  }
  $('#refreshBtn').textContent = 'Refresh';
  render();
}

const dist2 = (a, b, c, d) => (a - c) ** 2 + (b - d) ** 2;

// Estimate "stops away" along the route-6 pattern serving this stop
function stopsAway(eta, stopId) {
  const veh = state.vehicles.find(v => String(v.equipmentID) === String(eta.equipmentID));
  if (!veh) return null;
  const pat = state.patterns.find(p => p.stopIDs.includes(stopId));
  if (!pat) return null;
  let vIdx = 0, best = Infinity;
  pat.stopIDs.forEach((sid, i) => {
    const s = state.stopById.get(sid);
    if (!s) return;
    const d = dist2(s.lat, s.lng, veh.lat, veh.lng);
    if (d < best) { best = d; vIdx = i; }
  });
  const tIdx = pat.stopIDs.indexOf(stopId);
  let n = tIdx - vIdx;
  if (n < 0) n += pat.stopIDs.length;
  return n;
}

function render() {
  $('#board').innerHTML = TRIPS.map(t => {
    const etas = (state.etas[t.board] || []).slice().sort((a, b) => a.minutes - b.minutes).slice(0, 3);
    const rows = etas.map(e => {
      const away = stopsAway(e, t.board);
      const late = e.statuscolor && e.statuscolor.toUpperCase() !== '#000000' && e.schedule !== e.time;
      // same vehicle's predicted arrival at the destination stop
      const destEta = (state.etas[t.dest] || []).find(d => String(d.equipmentID) === String(e.equipmentID) && d.minutes > e.minutes);
      return `<div class="eta-row">
        <div class="eta-mid">
          <div class="dir">Board ${e.time}${away != null ? ` · ~${away} stops away` : ''}</div>
          <div class="meta">${destEta ? `arrive ${t.destName} ~${destEta.time}` : `to ${t.destName}`}${late ? ` · <span class="late">late (sched ${e.schedule})</span>` : ''} · Bus ${e.equipmentID}</div>
        </div>
        <div class="eta-min">${e.minutes <= 0 ? '<b class="now">Due</b>' : `<b>${e.minutes}</b><span>min</span>`}</div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="trip-head">
        <span class="trip-label">${t.icon} ${t.label}</span>
        <span class="trip-sub">${t.boardName} → ${t.destName}</span>
      </div>
      ${rows || '<div class="empty">No Route 6 arrivals right now (out of service hours?)</div>'}
    </div>`;
  }).join('');
}

function renderAge() {
  $('#age').textContent = state.lastOk ? `updated ${Math.round((Date.now() - state.lastOk) / 1000)} s ago` : '';
}

$('#refreshBtn').addEventListener('click', refresh);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

(async () => {
  try {
    await loadStatic();
  } catch (e) {
    $('#board').innerHTML = `<p class="notice">⚠️ Could not load route data: ${e.message}</p>`;
    return;
  }
  await refresh();
  setInterval(refresh, 20000);
  setInterval(renderAge, 1000);
})();
</script>
</body>
</html>
